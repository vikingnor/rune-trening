<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#16324f" />
  <title>Runes trening</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <div><div class="eyebrow">Personlig treningsapp</div><h1>Runes trening</h1></div>
  <button id="installBtn" class="ghost" hidden>Installer</button>
</header>

<main>
  <section id="today" class="view active"></section>
  <section id="program" class="view"></section>
  <section id="progress" class="view"></section>
  <section id="exercises" class="view"></section>
</main>

<nav class="bottomnav" aria-label="Hovedmeny">
  <button data-view="today" class="active"><span>●</span>I dag</button>
  <button data-view="program"><span>▦</span>Program</button>
  <button data-view="progress"><span>↗</span>Fremgang</button>
  <button data-view="exercises"><span>☰</span>Øvelser</button>
</nav>

<dialog id="exerciseDialog">
  <button class="close" aria-label="Lukk">×</button>
  <div id="dialogBody"></div>
</dialog>
<script src="app.js"></script>
</body>
</html>
